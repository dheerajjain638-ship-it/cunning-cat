name: CI

# Analyze + test on every push/PR, then build an installable Android APK.
# The iOS compile check runs only when started manually (macOS minutes are costly).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate brand images (logo, icon, splash)
        run: |
          pip install pillow
          python tool/make_icon.py

      - run: flutter pub get

      - name: Generate platform folders, app icon and splash
        run: bash tool/ensure_platforms.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Live mode: set repository variable CC_API_BASE (the Worker URL) and secret CC_APP_KEY.
      # Without them the APK runs on demo data.
      - name: Build Android APK
        env:
          CC_API_BASE: ${{ vars.CC_API_BASE }}
          CC_APP_KEY: ${{ secrets.CC_APP_KEY }}
        run: flutter build apk --release --dart-define=CC_API_BASE="$CC_API_BASE" --dart-define=CC_APP_KEY="$CC_APP_KEY"

      - name: Test the API server code
        run: node --test server/worker.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: cunning-cat-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate brand images (logo, icon, splash)
        run: |
          pip install pillow
          python tool/make_icon.py

      - run: flutter pub get

      - name: Generate platform folders, app icon and splash
        run: bash tool/ensure_platforms.sh

      - name: Build iOS (no code signing; compile check)
        run: flutter build ios --release --no-codesign
