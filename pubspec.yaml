name: cunning_cat
description: Cunning Cat - AI shopping decision app. Know more. Pay less. Buy better.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# Brand images are generated by tool/make_icon.py (run in CI before these).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: '#1E1B4B'
  adaptive_icon_foreground: assets/brand/icon_fg.png
  remove_alpha_ios: true

flutter_native_splash:
  color: '#1E1B4B'
  image: assets/brand/splash.png
  android_12:
    color: '#1E1B4B'
    image: assets/brand/icon_fg.png
